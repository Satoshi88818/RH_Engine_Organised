[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-engine"
version = "0.1.0"
description = "Riemann Hypothesis Engine — numerical experiments on the de Bruijn–Newman flow, gap lifetimes, form factors, and related objects"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Satoshi88818"},
]
keywords = ["riemann-hypothesis", "zeta-function", "de-bruijn-newman", "number-theory", "random-matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "mpmath>=1.2",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/Satoshi88818/RH-Engine"
Repository = "https://github.com/Satoshi88818/RH-Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.npy", "*.json"]
